<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HSE Building · Bushehr District — Facade concepts</title>
<style>
@font-face{font-family:'Vazirmatn';font-weight:500;font-display:block;src:url(data:font/woff2;base64,__FONT_MED__) format('woff2')}
@font-face{font-family:'Vazirmatn';font-weight:700;font-display:block;src:url(data:font/woff2;base64,__FONT_BOLD__) format('woff2')}
:root{--bg:rgba(13,19,27,.8);--line:rgba(255,255,255,.14);--tx:#eef2f6;--mut:#a9b4c0;--acc:#f2b84b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d141b;color:var(--tx);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.card{background:var(--bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
.fa{font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}
#top{position:fixed;left:14px;top:14px;padding:12px 14px;width:min(560px,calc(100% - 380px))}
#top h1{margin:0 0 2px;font-size:16px;letter-spacing:.2px}
#top .fa{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit}
.tab b{display:block;font-size:13px}.tab span{font-family:Vazirmatn,Tahoma,sans-serif;font-size:12px;color:var(--mut)}
.tab.on{border-color:var(--acc);background:rgba(242,184,75,.14)}
.tab i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 28px)}
#bar button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#bar button.on{border-color:var(--acc);color:var(--acc)}
#bar .sep{width:1px;background:var(--line);margin:2px}
#info{position:fixed;right:14px;top:14px;width:350px;max-height:calc(100% - 96px);overflow:auto;padding:14px 16px}
#info h2{margin:0;font-size:18px}#info .fa{color:var(--acc);font-size:14px;margin-top:2px}
#info h3{margin:14px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut)}
#info p{margin:6px 0;color:#d7dee6}
#info ul{margin:4px 0;padding-left:18px}#info li{margin:3px 0;color:#d7dee6}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sw div{display:flex;align-items:center;gap:7px;font-size:12px;color:#d7dee6;line-height:1.2}
.sw i{width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.25);flex:none}
.note{font-size:12px;color:var(--mut)}
#hint{position:fixed;left:14px;bottom:14px;font-size:12px;color:var(--mut);padding:6px 10px;max-width:260px}
#toggleInfo{display:none}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lightbox img{max-width:94%;max-height:94%;border-radius:10px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mut)}
body.noui .card{display:none!important}
@media (max-width:1100px){#hint{display:none}}
@media (max-width:900px){
  #top{left:8px;right:8px;top:8px;width:auto;padding:10px}#top h1{font-size:14px}#top .fa{display:none}
  .tab{padding:6px 7px}.tab b{font-size:12px}
  #info{top:auto;bottom:118px;right:8px;left:8px;width:auto;max-height:45%;display:none}#info.open{display:block}
  #toggleInfo{display:inline-block}#bar{bottom:8px;gap:4px;padding:6px}#bar button{padding:6px 8px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Loading 3D model…</div>
<div id="top" class="card">
  <h1>HSE Building · Bushehr District — facade concepts</h1>
  <div class="fa">اداره ایمنی، بهداشت و محیط زیست · شرکت نفت فلات قاره ایران · ناحیه بوشهر</div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="info" class="card"></div>
<div id="bar" class="card">
  <button data-view="front">Front</button>
  <button data-view="left">Left 45°</button>
  <button data-view="right">Right 45°</button>
  <button data-view="gate">Car gate</button>
  <button data-view="entrance">Staff entrance</button><button data-view="garden">Garden</button>
  <button data-view="aerial">Aerial</button>
  <span class="sep"></span>
  <button id="bNight">Night</button>
  <button id="bGate">Open gates</button>
  <button id="bSpin">Auto-rotate</button>
  <button id="toggleInfo">Info</button>
</div>
<div id="hint" class="card">Drag: rotate · Right-drag or Shift-drag: pan · Wheel / pinch: zoom · Keys 1-3 design, N night, G gates</div>
<div id="lightbox"><img alt=""></div>
<script>/*__THREE__*/</script>
<script>
/*__APP__*/
</script>
</body>
</html>
